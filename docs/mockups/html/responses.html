<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1b1b;--side:#262626;--card:#1b1b1b;--line:#3a3a3a;--txt:#f2f2f2;--mut:#a3a3a3;--dim:#7c7c7c;--red:#ff4b4b;--blue:#2f8be8;
--amberbg:#3a3014;--amber:#f5c542;--greenbg:#173a24;--green:#5fd38d;--bluebg:#132c45;--bluet:#8cc4ff;--redbg:#3d1a1a;--redt:#ff8a8a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Source Sans 3',Arial,sans-serif;font-size:15px}
.app{display:flex;min-height:100vh}
.side{width:280px;background:var(--side);padding:72px 18px 24px;flex-shrink:0}
.side .co{font-weight:700;font-size:15px;margin-bottom:16px}
.exp{border:1px solid var(--line);border-radius:8px;margin-bottom:24px}
.exp .h{padding:10px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.exp .b{padding:4px 14px 12px;border-top:1px solid var(--line)}
.exp .b p{margin:10px 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:14px;background:transparent;color:var(--txt);white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.main{flex:1;padding:56px 64px 60px;max-width:1200px}
h1{font-size:34px;margin:0 0 6px;font-weight:700}
.sub{color:var(--mut);font-size:14px;display:flex;gap:6px;align-items:center}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.chip.amber{background:var(--amberbg);color:var(--amber)}.chip.green{background:var(--greenbg);color:var(--green)}
.chip.blue{background:var(--bluebg);color:var(--bluet)}.chip.red{background:var(--redbg);color:var(--redt)}.chip.grey{background:#333;color:#cfcfcf}
.banner{border-radius:8px;padding:14px 16px;margin:18px 0 6px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner.amber{background:var(--amberbg);color:var(--amber)}.banner.green{background:var(--greenbg);color:var(--green)}
.banner.blue{background:var(--bluebg);color:var(--bluet)}.banner.red{background:var(--redbg);color:var(--redt)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:16px 0 18px;font-size:14px}
.tabs span{padding:8px 0}.tabs .on{color:var(--red);border-bottom:2px solid var(--red)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:14px}
.toolbar .note{color:var(--mut);font-size:13px;max-width:720px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.row1{display:grid;grid-template-columns:2.2fr 1fr 1.6fr 1.3fr;gap:12px;align-items:center}
.row1 b{font-weight:700}.late{color:var(--redt);font-weight:600}
.reb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line);border-radius:6px;margin-left:8px;color:var(--mut);font-size:15px;position:relative;vertical-align:middle}
.reb.hl{border-color:var(--redt);color:var(--redt)}
.tip{position:absolute;top:-34px;right:-8px;background:#444;color:#fff;font-size:12px;padding:4px 8px;border-radius:5px;white-space:nowrap}
.lq{font-size:13.5px;margin:14px 0 6px}.bar{height:6px;background:#333;border-radius:3px}.bar i{display:block;height:6px;border-radius:3px;background:var(--blue)}
.pipe{color:var(--dim);font-size:13px;margin:12px 0}
.sect{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
.files{border:1px solid var(--line);border-radius:8px}
.file{display:grid;grid-template-columns:28px 1fr 260px 90px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.file:first-child{border-top:none}.file .ic{font-size:16px}.file .role{color:var(--mut);font-size:13px}
.file a{color:var(--bluet);text-decoration:none;font-size:13.5px;text-align:right}
.xp{border:1px solid var(--line);border-radius:8px;margin-top:10px}
.xp .h{padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.xp .h .s{color:var(--mut);font-size:13px}
.qt{width:100%;border-collapse:collapse;font-size:13.5px}
.qt td,.qt th{padding:8px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.qt th{color:var(--mut);font-weight:600;font-size:12.5px}
.qt .src{color:var(--dim);font-size:12px}.qt a{color:var(--bluet);text-decoration:none}
.ko{display:inline-block;font-size:11px;background:var(--redbg);color:var(--redt);border-radius:4px;padding:0 5px;margin-left:4px}
.foot{display:flex;justify-content:flex-end;margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding-top:90px}
.dlg{background:#232323;border:1px solid var(--line);border-radius:12px;padding:22px 24px;width:560px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dlg.wide{width:880px}
.dlg h3{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between}
.dlg p{color:#d6d6d6;line-height:1.5;margin:0 0 10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.xl{border-collapse:collapse;font-size:12.5px;width:100%;background:#fff;color:#111}
.xl td{border:1px solid #d0d0d0;padding:3px 6px;white-space:nowrap;overflow:hidden;max-width:175px}
.xl .hd td{background:#f1f1f1;color:#555;text-align:center}
.sheets{display:flex;gap:2px;margin-top:6px}.sheets span{font-size:12px;padding:3px 10px;background:#333;border-radius:0 0 5px 5px}.sheets .on{background:#fff;color:#111;font-weight:600}
.lbl{position:fixed;top:10px;left:300px;background:#f4a261;color:#14213d;font-weight:700;font-size:13px;padding:4px 10px;border-radius:5px;z-index:9}
.mockflag{color:var(--dim);font-size:12px;margin-top:4px}
</style></head><body>

<div class="side">
 <div class="co">Sahyadri Consumer Products Ltd · Procurement</div>
 <div class="exp"><div class="h">▸ Evaluation settings</div></div>
 <div style="position:absolute;bottom:24px"></div>
 <div style="margin-top:12px"><span class="btn">Test Gemini</span></div>
</div>
<div class="main" id="main"></div>
</div>
