<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#1b1b1b;--side:#262626;--line:#3a3a3a;--txt:#f2f2f2;--mut:#a3a3a3;--dim:#7c7c7c;--red:#ff4b4b;--blue:#2f8be8;
--amberbg:#3a3014;--amber:#f5c542;--greenbg:#173a24;--green:#5fd38d;--bluebg:#132c45;--bluet:#8cc4ff;--redbg:#3d1a1a;--redt:#ff8a8a;--in:#262730}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:240px;background:var(--side);padding:72px 16px 24px;flex-shrink:0}
.side .co{font-weight:700;font-size:14.5px;margin-bottom:16px}
.exp{border:1px solid var(--line);border-radius:8px;margin-bottom:20px;padding:10px 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13.5px;color:var(--txt);white-space:nowrap;background:transparent}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ok{border-color:#2f6b45;color:var(--green)}
.main{flex:1;padding:50px 34px 50px;min-width:0}
h1{font-size:28px;margin:0 0 6px}
.sub{color:var(--mut);font-size:13.5px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.grey{background:#333;color:#cfcfcf}.green{background:var(--greenbg);color:var(--green)}.amber{background:var(--amberbg);color:var(--amber)}.blue{background:var(--bluebg);color:var(--bluet)}.redc{background:var(--redbg);color:var(--redt)}
.banner{border-radius:8px;padding:11px 16px;margin:12px 0 2px;display:flex;gap:10px;font-size:14px}
.b-amber{background:var(--amberbg);color:var(--amber)}.b-green{background:var(--greenbg);color:var(--green)}.b-blue{background:var(--bluebg);color:var(--bluet)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:12px 0 14px;font-size:14px}
.tabs span{padding:8px 0}.tabs .on{color:var(--red);border-bottom:2px solid var(--red)}
.pills{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill.on{background:#3a3a3a;border-color:#666;font-weight:600}
.pill .c{background:var(--amberbg);color:var(--amber);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700}
.pill .c.done{background:var(--greenbg);color:var(--green)}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.vh{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.vh .t{font-weight:700;font-size:16px}
.prog{height:6px;background:#333;border-radius:3px;margin:6px 0 12px}.prog i{display:block;height:6px;border-radius:3px;background:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg span{padding:5px 12px;font-size:12.5px;white-space:nowrap}.seg .on{background:#3a3a3a;font-weight:600}
.grp{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;display:flex;justify-content:space-between}
.item{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;background:#1f1f1f}
.item.sel{border-color:#8a6d1a;box-shadow:inset 3px 0 0 var(--amber)}
.item.done{opacity:.85}
.r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.d-red{background:#ff5c5c}.d-yel{background:#f5c542}.d-grn{background:#5fd38d}
.r1 .ttl{font-weight:700}
.r1 .fld{color:var(--mut)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:3px 10px;margin:8px 0 2px;font-size:13.5px}
.kv .k{color:var(--mut)}
.why{margin-top:6px;font-size:13.5px;line-height:1.45}
.acts{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.link{color:var(--bluet);font-size:13px}
.src{border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:12px;background:#151515}
.src .hd{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px}
.src .bd{max-height:760px;overflow:hidden;background:#fff}
.src img{width:100%;display:block}
.src .ft{padding:8px 12px;font-size:12.5px;color:var(--mut);border-top:1px solid var(--line);background:#151515}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;background:#181818}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.f .in{background:var(--in);border-radius:6px;padding:7px 10px;font-size:13.5px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th,td{padding:6px 8px;border-bottom:1px solid #2f2f2f;text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}
.fail{color:var(--redt);font-weight:600}.warn{color:var(--amber);font-weight:600}.pass{color:var(--green)}
.lbl{position:fixed;top:8px;left:256px;background:#f4a261;color:#14213d;font-weight:700;font-size:13px;padding:4px 10px;border-radius:5px;z-index:99}
.mut{color:var(--mut)}.dimt{color:var(--dim)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding-top:110px;z-index:50}
.dlg{background:#232323;border:1px solid var(--line);border-radius:12px;padding:22px 24px;width:600px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dlg h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between}
.dlg p{color:#d6d6d6;line-height:1.5;margin:0 0 10px}
.dlg .a{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.collapsed{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:13.5px}
.xl{border-collapse:collapse;font-size:11.5px;width:100%;color:#111}
.xl{table-layout:fixed}.xl td{border:1px solid #d0d0d0;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.xl td:first-child{width:24px}.xl td:last-child{width:34%}
.xl .h td{background:#f1f1f1;color:#555;text-align:center}
.xl .hl td{background:#fff3b0;outline:2px solid #e07800}
.em{padding:14px 16px;color:#111;font-family:Arial;font-size:13.5px;line-height:1.6}
.em mark{background:#fff3b0;outline:2px solid #e07800}
.note{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
</style></head><body>
<div class="app">
<div class="side"><div class="co">Sahyadri Consumer Products Ltd · Procurement</div><div class="exp">▸ Evaluation settings</div><span class="btn">Test Gemini</span></div>
<div class="main" id="main"></div></div>
<div id="ov"></div>
<script>
const S=(location.hash||'#01').slice(1);
const M=document.getElementById('main'),O=document.getElementById('ov');
function lbl(t){document.body.insertAdjacentHTML('beforeend',`<div class="lbl">${t}</div>`)}
function head(n,kind='amber'){const txt=kind==='green'?'<b>All items confirmed.</b> Ready to award in Analyst &amp; Award.':`<b>${n} items awaiting review.</b> These could change the award. Review them in Review &amp; Reconcile.`;
 return `<h1>Corrugated boxes - FY2026-27 annual rate contract</h1><div class="sub">RFQ · Response due 16 Nov 2026 · <span class="chip amber">Evaluating</span></div>
 <div class="banner b-${kind}"><span>${kind==='green'?'✅':'⚠️'}</span><span>${txt}</span></div>
 <div class="tabs"><span>Create RFQ</span><span>Responses</span><span class="on">Review &amp; Reconcile</span><span>Bid Analysis</span><span>Analyst &amp; Award</span></div>`}
function pills(on,counts){const v=[['V1','Deccan'],['V2','Shree Ganesh'],['V3','Western India'],['V4','Om Sai'],['V5','Krishna Kraft']];
 return `<div class="pills"><span class="mut" style="font-size:13px;margin-right:4px">Vendor</span>${v.map((x,i)=>{const c=counts[i];return `<span class="pill ${x[0]===on?'on':''}">${x[0]} · ${x[1]} <span class="c ${c===0?'done':''}">${c===0?'✓':c}</span></span>`}).join('')}</div>`}
function vh(title,done,total,clean,view='q'){const pct=Math.round(done/total*100);
 return `<div class="vh"><div><span class="t">${title}</span> <span class="mut" style="font-size:13px">· ${done} of ${total} reviewed</span></div><div style="display:flex;gap:8px;align-items:center"><span class="seg"><span class="${view==='q'?'on':''}">Needs review</span><span class="${view==='all'?'on':''}">All 30 lines</span></span>${clean?`<span class="btn ok">✓ Confirm ${clean} clean lines</span>`:''}</div></div><div class="prog"><i style="width:${pct}%"></i></div>`}
function item(o){
 const badge=(o.award?'<span class="chip redc">Could change the award</span>':'')+(o.badge||'');
 const st=o.state==='done'?`<span class="chip green">${o.doneTxt||'✓ Confirmed'}</span>`:o.state==='wait'?'<span class="chip amber">✉ Asked vendor · waiting</span>':'';
 return `<div class="item ${o.sel?'sel':''} ${o.state==='done'?'done':''}"><div class="r1"><span class="dot d-${o.dot}"></span><span class="ttl">${o.ttl}</span><span class="fld">· ${o.fld}</span>${badge}<span style="margin-left:auto">${st}</span></div>
 ${o.compact?`<div class="why mut">${o.compact}</div>`:`<div class="kv"><span class="k">Vendor wrote</span><span>${o.wrote}</span><span class="k">Read as</span><span>${o.read}</span></div><div class="why">${o.why}</div>`}
 ${o.extra||''}
 ${o.state==='done'||o.noacts?'':`<div class="acts">${o.acts||'<span class="btn sm">✓ Confirm as read</span><span class="btn sm">✎ Correct</span><span class="btn sm">✉ Ask vendor</span>'}<span class="link" style="margin-left:auto">${o.open?'▾':'▸'} Evidence &amp; checks</span></div>`}
 ${o.ev||''}</div>`}
function src(name,meta,body,ft){return `<div class="src"><div class="hd"><span><b>${name}</b> <span class="mut">· ${meta}</span></span><span class="link">⬇ Original</span></div><div class="bd">${body}</div><div class="ft">${ft}</div></div>`}
const v2src=(img,ft)=>src('V2_ShreeGanesh_Quotation_SGPI-Q-1127.pdf','page 1 of 2',`<img src="${img}">`,ft);
const T_pay={ttl:'Payment terms',fld:'all 30 lines',dot:'yel',wrote:'“Payment: 90 days credit from date of invoice.”',read:'90 days → <b>evaluated at 45 days</b>',why:'V2 is a small enterprise (vendor master). The MSMED Act caps credit for micro and small vendors at 45 days, so the evaluation uses 45 days, not 90.'};
const T_disc={ttl:'Cash discount',fld:'all 30 lines',dot:'yel',wrote:'“* Rates subject to 2% cash discount if payment is released within 15 days of invoice.”',read:'2% · <b>not applied</b> (conditional)',why:'Conditional discounts are never applied automatically. Turn it on only if you will pay within 15 days.',acts:'<span class="btn sm">✓ Keep not applied</span><span class="btn sm">Apply 2% discount</span><span class="btn sm">✉ Ask vendor</span>'};
const L6={ttl:'Line 6',fld:'Toothbrush retail display (inner) · price',dot:'red',award:1,wrote:'“620.00” in the column “Rate/box (₹)”',read:'₹620.00 per piece',why:'This is <b>100× the other vendors</b> (median ₹5.98/pc). The unit is probably per 100 pieces, which gives <b>₹6.20/pc</b>.'};
const L8={ttl:'Line 8',fld:'Face cream 50g x 96 shipper · price',dot:'red',award:1,wrote:'“944.00” in the column “Rate/box (₹)”',read:'₹944.00 per piece',why:'This is <b>103× the other vendors</b> (median ₹9.17/pc). The unit is probably per 100 pieces, which gives <b>₹9.44/pc</b>.'};
const L12={ttl:'Line 12',fld:'Spices 100g x 120 carton · price',dot:'red',award:1,wrote:'“1,229.00” in the column “Rate/box (₹)”',read:'₹1,229.00 per piece',why:'This is <b>105× the other vendors</b> (median ₹11.73/pc). The unit is probably per 100 pieces, which gives <b>₹12.29/pc</b>.'};
const bottom=(nq=0,um=0,rev=null)=>`${rev!==null?`<div class="grp"><span>Reviewed (${rev})</span><span class="link">Show ▸</span></div>`:''}<div class="collapsed"><span>Not quoted <span class="mut">(${nq})</span></span><span class="mut">▸</span></div><div class="collapsed"><span>Unmatched lines <span class="mut">(${um})</span></span><span class="mut">▸</span></div>`;
const C=[0,5,4,2,5];

/* 01 default */
if(S==='01'){lbl('01 · Default: V2 selected, needs-review queue, source beside');
 M.innerHTML=head(19)+pills('V2',[3,5,4,2,5])+`<div class="cols"><div>${vh('V2 · Shree Ganesh Packaging Industries',0,5,27)}
 <div class="grp"><span>Vendor terms · apply to all 30 lines</span></div>${item(T_pay)}${item(T_disc)}
 <div class="grp"><span>Lines · 3 to review</span><span class="dimt" style="text-transform:none;font-weight:400">sorted: could change the award first</span></div>${item({...L6,sel:1})}${item(L8)}${item(L12)}${bottom(0,0)}</div>
 ${v2src('v2_l6.png','Highlighted: Sr 6, “Rate/box (₹)” column · found from the PDF text')}</div>`}

/* 02 correct inline */
if(S==='02'){lbl('02 · ✎ Correct: inline fix with live price preview');
 const ex=`<div class="box"><div class="g3"><div class="f"><label>Unit</label><div class="in">Per 100 pieces ▾ <span class="chip green" style="margin-left:6px">suggested</span></div></div><div class="f"><label>Price as written</label><div class="in">620.00</div></div><div class="f"><label>Result</label><div class="in"><b>₹6.20/pc</b> · landed ₹6.80 · evaluated ₹6.83</div></div></div>
 <div class="f" style="margin-top:10px"><label>Reason (saved to the audit trail)</label><div class="in">Value is 100× the other vendors; “Rate/box” here means per 100 pieces.</div></div>
 <div class="acts"><span class="btn primary sm">Save correction</span><span class="btn sm">Cancel</span><span class="mut" style="font-size:12.5px">Also apply to lines 8 and 12 (same column, same problem)? <span class="link">Yes, apply to all 3</span></span></div></div>`;
 M.innerHTML=head(19)+pills('V2',[3,5,4,2,5])+`<div class="cols"><div>${vh('V2 · Shree Ganesh Packaging Industries',0,5,27)}
 <div class="grp"><span>Vendor terms · apply to all 30 lines</span></div>${item({...T_pay,compact:'90 days → evaluated at 45 days (MSMED Act cap)',wrote:0})}${item({...T_disc,compact:'2% if paid within 15 days · not applied'})}
 <div class="grp"><span>Lines · 3 to review</span></div>${item({...L6,sel:1,noacts:1,extra:ex})}${item(L8)}${item(L12)}</div>
 ${v2src('v2_l6.png','Highlighted: Sr 6, “Rate/box (₹)” column')}</div>`}

/* 03 after actions */
if(S==='03'){lbl('03 · After actions: auto-advance to the next item, progress updates');
 M.innerHTML=head(17)+pills('V2',[3,3,4,2,5])+`<div class="cols"><div>${vh('V2 · Shree Ganesh Packaging Industries',2,5,27)}
 <div class="note b-green">✅ Line 6 corrected to ₹6.20/pc (per 100). Moved to Reviewed. <span class="link">Undo</span></div>
 <div class="grp"><span>Vendor terms · apply to all 30 lines</span></div>${item(T_disc)}
 <div class="grp"><span>Lines · 2 to review</span></div>${item({...L8,sel:1})}${item(L12)}
 <div class="grp"><span>Reviewed (2)</span><span class="link">Hide ▾</span></div>
 ${item({...T_pay,state:'done',doneTxt:'✓ Confirmed · 14:51',compact:'90 days → evaluated at 45 days (MSMED Act cap). Confirmed by Rohit.'})}
 ${item({...L6,award:0,state:'done',doneTxt:'✎ Corrected · 14:52',compact:'₹620.00 per piece → <b>₹6.20/pc</b> (per 100). Reason: value is 100× the other vendors. <span class="link">Undo</span>'})}
 ${bottom(0,0)}</div>
 ${v2src('v2_l8.png','Highlighted: Sr 8, “Rate/box (₹)” column')}</div>`}

/* 04 evidence expanded */
if(S==='04'){lbl('04 · ▾ Evidence & checks expanded (failed checks first)');
 const ev=`<div class="box"><table><tr><th>Check</th><th>Result</th><th>Detail</th></tr>
 <tr><td>Sanity vs other vendors</td><td class="fail">✗ Fail</td><td>₹944.00 is 103× the median of V1, V3, V4, V5 (₹9.17)</td></tr>
 <tr><td>Sanity vs last year</td><td class="fail">✗ Fail</td><td>₹944.00 is about 100× last year's price for this line (₹9.58–₹9.94, supplied by V5 and V1)</td></tr>
 <tr><td>Unit stated</td><td class="warn">! Warn</td><td>Header says “Rate/box”, but the size of the number suggests per 100</td></tr></table>
 <div class="link" style="margin:8px 0">▸ 10 of 13 checks passed · show all</div>
 <div style="font-size:13px;line-height:1.6"><b>How computed:</b> 944.00 read as per piece → ₹944.00 + freight ₹0.60 (quoted) = landed ₹944.60 · payment loading (45 vs 60 days) +₹4.23 → evaluated ₹948.83<br><b>Source:</b> page 1, Sr 8, column “Rate/box (₹)” · second read agrees on the number and the header</div></div>`;
 M.innerHTML=head(17)+pills('V2',[3,3,4,2,5])+`<div class="cols"><div>${vh('V2 · Shree Ganesh Packaging Industries',2,5,27)}
 <div class="grp"><span>Lines · 2 to review</span></div>${item({...L8,sel:1,open:1,ev})}${item(L12)}${bottom(0,0,2)}</div>
 ${v2src('v2_l8.png','Highlighted: Sr 8, “Rate/box (₹)” column')}</div>`}

/* 05 bulk confirm */
if(S==='05'){lbl('05 · ✓ Confirm clean lines: the buyer sees all 27 before confirming');
 const R=[[1, "Shampoo 180ml bottle shipper (24s)", "₹8.42", "₹8.42", "₹9.02"], [2, "Shampoo sachet master (960s)", "₹13.34", "₹13.34", "₹13.94"], [3, "Bathing soap 75g x 144 carton", "₹12.82", "₹12.82", "₹13.42"], [4, "Bathing soap 125g x 72 carton", "₹12.46", "₹12.46", "₹13.06"], [5, "Toothpaste 150g x 72 shipper", "₹15.30", "₹15.30", "₹15.90"], [7, "Hair oil 100ml x 48 shipper", "₹11.16", "₹11.16", "₹11.76"], [9, "Biscuit 75g x 60 carton", "₹16.73", "₹16.73", "₹17.33"], [10, "Noodles 70g x 96 carton", "₹19.54", "₹19.54", "₹20.14"], [11, "Tea 250g x 40 carton", "₹16.52", "₹16.52", "₹17.12"], [13, "Detergent powder 1kg x 20 master", "₹38.49", "₹38.49", "₹39.09"], [14, "Detergent powder 500g x 40 master", "₹38.28", "₹38.28", "₹38.88"], [15, "Liquid detergent 1L x 12 shipper", "₹32.98", "₹32.98", "₹33.58"], [16, "Dishwash bar 200g x 100 carton", "₹33.42", "₹33.42", "₹34.02"], [17, "Floor cleaner 1L x 12 shipper", "₹36.15", "₹36.15", "₹36.75"], [18, "Toilet cleaner 500ml x 24 shipper", "₹32.55", "₹32.55", "₹33.15"], [19, "Edible oil 1L pouch x 16 carton", "₹33.02", "₹33.02", "₹33.62"], [20, "Edible oil 1L bottle x 12 carton", "₹32.38", "₹32.38", "₹32.98"], [21, "Ghee 500ml jar x 24 carton", "₹28.97", "₹28.97", "₹29.57"], [22, "Atta 5kg x 4 carton", "₹43.70", "₹43.70", "₹44.30"], [23, "Sugar 1kg x 20 carton", "₹35.45", "₹35.45", "₹36.05"], [24, "Hand wash 250ml x 24 shipper", "₹27.94", "₹27.94", "₹28.54"], [25, "Mixed SKU e-commerce shipper", "₹34.12", "₹34.12", "₹34.72"], [26, "Promo gift-pack outer", "₹40.80", "₹40.80", "₹41.40"], [27, "Export detergent 25kg bulk carton", "₹101.69", "₹101.69", "₹102.29"], [28, "Export edible oil 15L tin x 2 carton", "₹92.18", "₹92.18", "₹92.78"], [29, "Pallet-load spice drum outer", "₹110.17", "₹110.17", "₹110.77"], [30, "Heavy-duty atta 25kg export carton", "₹103.50", "₹103.50", "₹104.10"]];
 M.innerHTML=head(17)+pills('V2',[3,3,4,2,5])+`<div class="cols"><div>${vh('V2 · Shree Ganesh Packaging Industries',2,5,27)}<div class="grp"><span>Lines · 2 to review</span></div>${item({...L8,sel:1})}${item(L12)}</div>${v2src('v2_l8.png','')}</div>`;
 O.innerHTML=`<div class="overlay" style="padding-top:40px"><div class="dlg" style="width:820px"><h3>Confirm 27 clean lines for V2? <span class="mut">✕</span></h3><p>Every check passed on these lines. Scan them, then confirm. They are logged in the audit trail as one entry.</p>
 <div style="max-height:470px;overflow:hidden;border:1px solid var(--line);border-radius:8px"><table><tr><th>Line</th><th>Description</th><th class="r">Vendor wrote</th><th class="r">₹/pc</th><th class="r">Landed</th><th>Checks</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="r">${r[2]}</td><td class="r">${r[3]}</td><td class="r">${r[4]}</td><td class="pass">13/13 ✓</td></tr>`).join('')}</table></div>
