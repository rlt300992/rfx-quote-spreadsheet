<!doctype html>

<style>
:root{--bg:#1b1b1b;--side:#262626;--line:#3a3a3a;--txt:#f2f2f2;--mut:#a3a3a3;--dim:#7c7c7c;--red:#ff4b4b;--blue:#2f8be8;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:14.5px}
.app{display:flex;min-height:100vh}
.side{width:260px;background:var(--side);padding:72px 18px 24px;flex-shrink:0}
.side .co{font-weight:700;font-size:15px;margin-bottom:16px}
.exp{border:1px solid var(--line);border-radius:8px;margin-bottom:20px;padding:10px 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:14px;color:var(--txt);white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.dis{opacity:.35}
.main{flex:1;padding:52px 40px 50px}
h1{font-size:30px;margin:0 0 6px}
.sub{color:var(--mut);font-size:14px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
.grey{background:#333;color:#cfcfcf}.green{background:var(--greenbg);color:var(--green)}.amber{background:var(--amberbg);color:var(--amber)}.blue{background:var(--bluebg);color:var(--bluet)}.redc{background:var(--redbg);color:var(--redt)}
.banner{border-radius:8px;padding:12px 16px;margin:14px 0 4px;display:flex;gap:10px;font-size:14.5px}
.b-amber{background:var(--amberbg);color:var(--amber)}.b-green{background:var(--greenbg);color:var(--green)}.b-blue{background:var(--bluebg);color:var(--bluet)}.b-red{background:var(--redbg);color:var(--redt)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:14px 0 14px;font-size:14px}
.tabs span{padding:8px 0}.tabs .on{color:var(--red);border-bottom:2px solid var(--red)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg span{padding:7px 14px;font-size:13.5px}.seg .on{background:#3a3a3a;font-weight:600}
.bar .l{color:var(--mut);font-size:13px}
.cols{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.sec .hd{display:flex;align-items:center;gap:10px;padding:12px 16px}
.sec .hd .n{width:22px;height:22px;border-radius:50%;background:#333;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.sec .hd .t{font-weight:700;font-size:15.5px;white-space:nowrap}
.sec .hd .sum{color:var(--mut);font-size:13px;margin-left:auto;text-align:right}
.sec .bd{padding:4px 16px 14px;border-top:1px solid var(--line)}
.sec.done .n{background:var(--greenbg);color:var(--green)}
.sec.err .n{background:var(--redbg);color:var(--redt)}
.sec.cur{border-color:#5a5a5a;box-shadow:0 0 0 1px #5a5a5a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin-top:10px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.f div{background:var(--in);border-radius:6px;padding:8px 10px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f div.new{box-shadow:inset 3px 0 0 var(--green)}
.f div.bad{box-shadow:inset 0 0 0 1px var(--redt);color:var(--redt)}
.f small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12.8px;margin-top:10px}
th,td{padding:6px 8px;border-bottom:1px solid #2f2f2f;text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}

td.w{white-space:normal}
.warnrow td{background:var(--redbg);color:var(--redt)}
.tog{display:inline-block;width:30px;height:16px;border-radius:8px;background:#444;position:relative;vertical-align:middle}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#bbb}
.tog.on{background:var(--red)}.tog.on::after{left:16px;background:#fff}
.cb{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid #777;vertical-align:middle}
.cb.on{background:var(--red);border-color:var(--red);position:relative}.cb.on::after{content:'✓';color:#fff;font-size:11px;position:absolute;left:2px;top:-2px}
.chat{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.chat .hd{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between}
.msgs{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.45}
.m.ai{background:#262626}.m.me{background:#1f3a5c;align-self:flex-end}
.m code{font-size:12px;color:#cde}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.sugg span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:#ddd}
.inp{margin:0 14px 14px;background:var(--in);border-radius:8px;padding:10px 12px;color:#777;font-size:13.5px;display:flex;justify-content:space-between}
.ck{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ck div{background:#222;border-radius:6px;padding:8px 10px;font-size:13px}
.ck div.x{background:var(--redbg);color:var(--redt)}.ck div.w{background:var(--amberbg);color:var(--amber)}
.lbl{position:fixed;top:10px;left:280px;background:#f4a261;color:#14213d;font-weight:700;font-size:13px;padding:4px 10px;border-radius:5px;z-index:99}
.mut{color:var(--mut)}
.note{border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-start;justify-content:center;padding-top:60px;z-index:50}
.dlg{background:#232323;border:1px solid var(--line);border-radius:12px;padding:22px 24px;width:600px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.dlg.wide{width:960px}
.dlg h3{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between}
.dlg p{color:#d6d6d6;line-height:1.5;margin:0 0 10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.em{background:#1b1b1b;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.55}
.em .k{color:var(--mut);display:inline-block;width:64px}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:13.5px}
.att a{color:var(--bluet)}
.xl{border-collapse:collapse;font-size:12px;width:100%;background:#fff;color:#111;margin:0}
.xl td{border:1px solid #d0d0d0;padding:3px 6px;white-space:nowrap;border-bottom:1px solid #d0d0d0}
.xl .hd td{background:#f1f1f1;color:#555;text-align:center}
.xl .th td{background:#14213d;color:#fff;font-weight:600}
.xl .fill{background:#fff7d6}
.sheets{display:flex;gap:2px;margin-top:6px}.sheets span{font-size:12px;padding:3px 10px;background:#333;border-radius:0 0 5px 5px}.sheets .on{background:#fff;color:#111;font-weight:600}
