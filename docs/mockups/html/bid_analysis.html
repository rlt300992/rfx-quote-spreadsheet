<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#1b1b1b;--side:#262626;--line:#3a3a3a;--txt:#f2f2f2;--mut:#a3a3a3;--dim:#7c7c7c;--red:#ff4b4b;
--amberbg:#3a3014;--amber:#f5c542;--greenbg:#173a24;--green:#5fd38d;--bluebg:#132c45;--bluet:#8cc4ff;--redbg:#3d1a1a;--redt:#ff8a8a;--in:#262730}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Source Sans 3','Segoe UI',Arial,sans-serif;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:230px;background:var(--side);padding:72px 16px 24px;flex-shrink:0}
.side .co{font-weight:700;font-size:14.5px;margin-bottom:16px}
.exp{border:1px solid var(--line);border-radius:8px;margin-bottom:20px;padding:10px 14px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--txt);white-space:nowrap}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.sm{padding:3px 9px;font-size:12px}
.main{flex:1;padding:50px 30px 50px;min-width:0}
h1{font-size:28px;margin:0 0 6px}
h3{font-size:17px;margin:22px 0 10px}
.sub{color:var(--mut);font-size:13.5px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.grey{background:#333;color:#cfcfcf}.green{background:var(--greenbg);color:var(--green)}.amber{background:var(--amberbg);color:var(--amber)}.blue{background:var(--bluebg);color:var(--bluet)}.redc{background:var(--redbg);color:var(--redt)}
.banner{border-radius:8px;padding:11px 16px;margin:12px 0 2px;display:flex;gap:10px;font-size:14px;background:var(--amberbg);color:var(--amber)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:12px 0 16px;font-size:14px}
.tabs span{padding:8px 0}.tabs .on{color:var(--red);border-bottom:2px solid var(--red)}
.hero{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#1f1f1f}
.hero .t{font-size:13px;color:var(--mut);margin-bottom:4px}
.hero .big{font-size:17px;line-height:1.5}
.kp{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.kp div{background:#232323;border-radius:8px;padding:10px 12px}
.kp .l{font-size:12px;color:var(--mut)}.kp .v{font-size:22px;font-weight:700;margin-top:2px}.kp .s{font-size:12px;margin-top:2px}
.sc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#1f1f1f;display:flex;flex-direction:column;gap:6px}
.card.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.card .n{font-weight:700;font-size:14.5px}.card .d{font-size:12.5px;color:var(--mut);min-height:34px}
.card .row{display:flex;justify-content:space-between;font-size:13px}
.card .row span:first-child{color:var(--mut)}
.risk{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.risk span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px}
.risk b{color:var(--amber)}
.tool{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg span{padding:5px 11px;font-size:12.5px;white-space:nowrap}.seg .on{background:#3a3a3a;font-weight:600}
.fil{display:flex;gap:6px;flex-wrap:wrap}.fil span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}.fil .on{background:#3a3a3a;border-color:#777;font-weight:600}
table.g{width:100%;border-collapse:separate;border-spacing:0;font-size:12.8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.g th,.g td{padding:6px 8px;border-bottom:1px solid #2c2c2c;text-align:left;white-space:nowrap}
.g th{background:#232323;font-weight:600;font-size:12px;color:#ddd;vertical-align:top}
.g td.r,.g th.r{text-align:right}
.g td.v{text-align:right;border-left:1px solid #2c2c2c}
.g .win{background:#1d4a2e;color:#d9f7e4;font-weight:700}
.g .hi{color:#ff9b9b}
.g .off{color:#6c6c6c}
.g .tag{display:block;font-size:10.5px;color:var(--dim);font-weight:400}
.g .tag.a{color:var(--amber)}.g .tag.r{color:var(--redt)}
.g .nfdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:4px;vertical-align:middle}
.vh2 .nm{font-weight:700;font-size:12.5px}.vh2 .m{font-size:11px;color:var(--mut);font-weight:400;margin-top:2px}
.g tr.sel td{outline:1px solid #8a6d1a}
.leg{font-size:12px;color:var(--mut);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.lbl{position:fixed;top:8px;left:246px;background:#f4a261;color:#14213d;font-weight:700;font-size:13px;padding:4px 10px;border-radius:5px;z-index:99}
.mut{color:var(--mut)}
.note{border-radius:8px;padding:10px 14px;font-size:13.5px;margin:12px 0}
.b-blue{background:var(--bluebg);color:var(--bluet)}.b-amb{background:var(--amberbg);color:var(--amber)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;background:#222;border-left:1px solid var(--line);padding:22px 24px;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.5);overflow:hidden}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}
.drawer h2{font-size:19px;margin:0 0 4px;display:flex;justify-content:space-between}
.wf{margin:14px 0}
.wfr{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.wfr .bar{height:18px;border-radius:4px;background:#3a5f8a}
.wfr .bar.add{background:#8a6d1a}.wfr .bar.tot{background:#2f6b45}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px;background:#1f1f1f}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}
.xp{border:1px solid var(--line);border-radius:10px;margin-top:12px}
.xp .h{padding:11px 14px;font-weight:600;display:flex;gap:10px;align-items:center}
.xp table{width:100%;border-collapse:collapse;font-size:12.8px}
.xp td,.xp th{padding:7px 12px;border-top:1px solid #2c2c2c;text-align:left}
.xp th{color:var(--mut);font-weight:600;font-size:12px}
</style></head><body>

function landed(s){let t=0;for(const n in s.win){const w=s.win[n];if(w)t+=Q(w,n).land*DATA.lines[n].q}return t}
function hero(k){const s=DATA.S[k];const v=Object.entries(s.vend).map(([a,b])=>`${a} ${b} lines`).join(' · ');const pct=s.sav/s.ly*100;
 return `<div class="hero"><div class="t">RECOMMENDED AWARD · ${SC[k][0]}</div><div class="big">Award <b>${s.lines} of 30 lines</b> to <b>${Object.keys(s.vend).length} vendors</b> (${v}) for <b>${cr(s.tot)}</b> a year, ${s.sav>=0?'saving':'costing'} <b>${lk(Math.abs(s.sav))}</b> (${Math.abs(pct).toFixed(1)}%) ${s.sav>=0?'vs':'more than'} last year on the same lines.</div>
 <div class="kp"><div><div class="l">Annual value (evaluated)</div><div class="v">${cr(s.tot)}</div><div class="s mut">ranking price, incl. payment cost</div></div>
 <div><div class="l">Landed vs last year</div><div class="v" style="color:${s.sav>=0?'var(--green)':'var(--redt)'}">${s.sav>=0?'↓':'↑'} ${lk(Math.abs(s.sav))}</div><div class="s mut">${cr(landed(s))} vs ${cr(s.ly)}</div></div>
 <div><div class="l">Lines with a winner</div><div class="v">${s.lines} / 30</div><div class="s ${s.lines<30?'':'mut'}" style="${s.lines<30?'color:var(--redt)':''}">${s.lines<30?(30-s.lines)+' lines have no eligible bid':'every line covered'}</div></div>
 <div><div class="l">On not-firm prices</div><div class="v" style="color:${s.nf?'var(--amber)':'var(--green)'}">${s.nf?cr(s.nf):'₹0'}</div><div class="s mut">${s.nfl} lines · kraft-linked (V3)</div></div>
 <div><div class="l">Vendors used</div><div class="v">${Object.keys(s.vend).length}</div><div class="s mut">${Object.keys(s.vend).join(', ')}</div></div></div></div>`}
function cards(on){return `<h3>Scenarios <span class="mut" style="font-size:12.5px;font-weight:400">· pick one to see it in the grid. Custom what-ifs: ask the analyst.</span></h3><div class="sc">${Object.keys(SC).map(k=>{const s=DATA.S[k];return `<div class="card ${k===on?'on':''}"><div class="n">${k===on?'● ':''}${SC[k][0]}</div><div class="d">${SC[k][1]}</div>
 <div class="row"><span>Annual value</span><b>${cr(s.tot)}</b></div><div class="row"><span>Landed vs last year</span><b style="color:${s.sav>=0?'var(--green)':'var(--redt)'}">${s.sav>=0?'↓':'↑'} ${lk(Math.abs(s.sav))}</b></div>
 <div class="row"><span>Lines covered</span><b style="${s.lines<30?'color:var(--redt)':''}">${s.lines}/30</b></div><div class="row"><span>Not-firm value</span><b style="color:${s.nf?'var(--amber)':'var(--green)'}">${s.nf?cr(s.nf):'₹0'}</b></div>
 <div class="row"><span>Vendors</span><b>${Object.keys(s.vend).join(', ')}</b></div>
 <div style="margin-top:4px">${k===on?'<span class="btn primary sm">Use this scenario → Analyst &amp; Award</span>':'<span class="btn sm">Show in grid</span>'}</div></div>`}).join('')}</div>`}
function risks(){return `<div class="risk"><span>⚠ <b>${cr(DATA.S.A.nf)}</b> on prices not firm (V3) →</span><span>⚠ <b>4</b> unconfirmed values (V2 lines 6, 8, 12 · V4 line 14) →</span><span>≈ <b>57</b> prices with freight estimated (V4, V5) →</span><span>◐ <b>2</b> vendors pending qualification (V2, V4) →</span><span>✕ <b>3</b> lines not quoted by V4 →</span></div>`}
const VH={V1:['Qualified','green','60 days · FOR incl.','30/30'],V2:['Pending','amber','90→45 days (MSME)','30/30'],V3:['Qualified','green','30 days · USD · not firm','30/30'],V4:['Pending','amber','15 days · late','27/30'],V5:['Disqualified','redc','ISO expired','30/30']};
function allowed(k){return k==='B'?['V1','V2','V3','V4']:k==='C'?['V1']:['V1','V3']}
function cell(v,n,k,mode){const o=Q(v,n);const s=DATA.S[k];const al=allowed(k);
 if(!o) return `<td class="v off">—<span class="tag">Not quoted</span></td>`;
 const vals=V.map(x=>Q(x,n)).filter(x=>x&&x.st!=='unconf').map(x=>x.ev);const hi=Math.max(...vals);
 const w=s.win[n]===v;const el=al.includes(v);let tag='',cls='';
 if(o.st==='unconf'){tag='<span class="tag r">Unconfirmed</span>';cls='off'}
 else if(o.st==='sub'&&k!=='D'){tag='<span class="tag a">Substitute · not accepted</span>';cls='off'}
 else if(o.st==='dev'&&k!=='D'){tag='<span class="tag a">Spec deviation</span>';cls='off'}
 else if(!el){cls='off'}
 const best=s.win[n]?Q(s.win[n],n).ev:null;
 let txt;if(mode==='pct'){txt=o.st==='unconf'?'—':best?((o.ev/best-1)*100===0?'L1':'+'+((o.ev/best-1)*100).toFixed(1)+'%'):'—'}else txt=o.st==='unconf'?o.ev.toFixed(0):o.ev.toFixed(2);
 if(w) cls='win'; else if(o.ev===hi&&el&&o.st!=='unconf') cls+=' hi';
 return `<td class="v ${cls}">${txt}${o.nf&&w?'<span class="nfdot" title="price not firm"></span>':''}${tag}</td>`}
function grid(k,mode='inr',filt=null,sel=null){const s=DATA.S[k];const al=allowed(k);
 let rows=Object.keys(DATA.lines).map(Number);
 if(filt==='close') rows=rows.filter(n=>{const w=s.win[n],b=s.bk[n];return w&&b&&(Q(b,n).ev/Q(w,n).ev-1)<0.02});
 return `<div class="tool"><div style="display:flex;gap:10px;align-items:center"><span class="seg"><span class="on">Evaluated</span><span>Landed</span></span><span class="seg"><span class="${mode==='inr'?'on':''}">₹ / pc</span><span class="${mode==='pct'?'on':''}">% above cheapest</span><span>Annual value</span></span></div>
 <div class="fil"><span class="on">All plies</span><span>3-ply</span><span>5-ply</span><span>7-ply</span><span class="${filt==='close'?'on':''}">Close calls (&lt;2%)</span><span>At-risk lines</span><span>☆ Starred vendors</span><span>⬇ Excel</span></div></div>
 <table class="g"><tr><th>#</th><th>Line</th><th class="r">Annual qty</th><th class="r">Last yr</th>${V.map(v=>`<th class="r vh2" style="border-left:1px solid #2c2c2c;${al.includes(v)?'':'opacity:.55'}"><div class="nm">☆ ${v} · ${VN[v]}</div><div class="m"><span class="chip ${VH[v][1]}">${VH[v][0]}</span> ${VH[v][3]} lines</div><div class="m">${VH[v][2]}</div></th>`).join('')}<th>Winner · vs last yr</th><th></th></tr>
 ${rows.map(n=>{const L=DATA.lines[n];const w=s.win[n];const b=s.bk[n];let wc='<span style="color:var(--redt)">No eligible bid</span>';
  if(w){const o=Q(w,n);const d=(o.land/L.ly-1)*100;const close=b&&(Q(b,n).ev/o.ev-1)<0.02;wc=`<b>${w}</b> <span style="color:${d<=0?'var(--green)':'var(--redt)'}">${d<=0?'↓':'↑'}${Math.abs(d).toFixed(1)}%</span>${close?' <span class="chip amber">close: '+b+'</span>':''}`}
  return `<tr class="${sel===n?'sel':''}"><td>${n}</td><td>${L.d} <span class="mut">· ${L.ply}-ply</span></td><td class="r">${L.q.toLocaleString('en-IN')}</td><td class="r mut">${L.ly.toFixed(2)}</td>${V.map(v=>cell(v,n,k,mode)).join('')}<td>${wc}</td><td><span title="Ask about this line">💬</span></td></tr>`}).join('')}</table>
 <div class="leg"><span><span style="background:#1d4a2e;padding:0 6px;border-radius:3px">green</span> cheapest eligible (winner)</span><span style="color:#ff9b9b">red = highest bid</span><span style="color:#6c6c6c">grey = can't win in this scenario</span><span><span class="nfdot"></span> price not firm</span><span>Click any price for its build-up · ₹ per piece, GST excluded</span></div>`}
function charts(k){const s=DATA.S[k];const byv=s.byv;const mx=Math.max(...Object.values(byv));
 const bars=Object.entries(byv).sort((a,b)=>b[1]-a[1]).map(([v,x])=>`<div style="display:grid;grid-template-columns:150px 1fr 90px;gap:8px;align-items:center;margin:8px 0;font-size:13px"><span>${v} · ${VN[v]}</span><div style="height:20px;border-radius:4px;background:#3f7f5a;width:${x/mx*100}%"></div><b>${cr(x)}</b></div>`).join('');
 const W=640,H=300,lines=Object.keys(DATA.lines).map(Number);let dots='';
 lines.forEach((n,i)=>{const w=s.win[n];if(!w)return;const best=Q(w,n).ev;const vals=V.map(v=>[v,Q(v,n)]).filter(x=>x[1]&&x[1].st!=='unconf');
  vals.forEach(([v,o])=>{const p=Math.max(-15,Math.min(25,(o.ev/best-1)*100));const x=50+i*(W-70)/29;const y=(H-30)-(p+15)/40*(H-60);const col={V1:'#6aa7ff',V2:'#c58cff',V3:'#f5c542',V4:'#5fd3c8',V5:'#777'}[v];
   dots+=`<circle cx="${x}" cy="${y}" r="${w===v?6:4}" fill="${col}" ${w===v?'stroke="#fff" stroke-width="2"':''} opacity="${v==='V5'?.6:.95}"/>`})});
 const ax=[-15,-10,-5,0,5,10,15,20,25].map(p=>{const y=(H-30)-(p+15)/40*(H-60);return `<line x1="44" x2="${W}" y1="${y}" y2="${y}" stroke="${p===0?'#5fd38d':'#333'}" ${p===0?'stroke-width="1.5"':''}/><text x="2" y="${y+4}" fill="${p===0?'#5fd38d':'#999'}" font-size="11">${p===0?'winner':(p>0?'+':'')+p+'%'}</text>`}).join('');
 const xl=lines.filter(n=>n%5===0||n===1).map(n=>`<text x="${50+(n-1)*(W-70)/29-4}" y="${H-10}" fill="#999" font-size="11">${n}</text>`).join('');
 return `<h3>Charts</h3><div class="two"><div class="panel"><div style="font-weight:600;margin-bottom:6px">Award value by vendor <span class="mut" style="font-weight:400">· this scenario</span></div>${bars}<div class="mut" style="font-size:12px;margin-top:8px">Disqualified vendors are never shown as winners or ranked on savings.</div></div>
 <div class="panel"><div style="font-weight:600;margin-bottom:6px">Price spread per line <span class="mut" style="font-weight:400">· each dot is a vendor's price vs the winner (green line); below the line = cheaper but can't win</span></div><svg width="${W}" height="${H}">${ax}${dots}${xl}<text x="${W/2-20}" y="${H+0}" fill="#999" font-size="11"></text></svg>
 <div class="leg">${V.map(v=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${{V1:'#6aa7ff',V2:'#c58cff',V3:'#f5c542',V4:'#5fd3c8',V5:'#777'}[v]}"></span> ${v}${v==='V5'?' (disqualified)':''}</span>`).join('')}<span>x = line number · capped at −15% / +25%</span></div></div></div>`}
function qual(open){if(!open) return `<div class="xp"><div class="h">▸ Qualification &amp; documents <span class="chip green">2 qualified</span><span class="chip amber">2 pending</span><span class="chip redc">1 disqualified</span></div></div>`;
 const q=[['V1','Qualified','green','All 3 knock-outs met','ISO 9001 valid to Aug 2027 · BS test report 20 Sep 2026'],['V2','Pending','amber','Q01: ISO certificate is in the group company\'s name · Q03: rejection answer is conditional','ISO 9001 valid to Mar 2028 (holder: Shree Ganesh Group Holdings)'],['V3','Qualified','green','All 3 knock-outs met','ISO 9001 valid to Jan 2028 · FSC valid to Jun 2028'],['V4','Pending','amber','No questionnaire sent (Q01–Q03 unanswered)','None'],['V5','Disqualified','redc','Q01: ISO 9001 expired 31 Mar 2026 (before the award date)','ISO 9001 expired 31 Mar 2026']];
 return `<div class="xp"><div class="h">▾ Qualification &amp; documents <span class="mut" style="font-weight:400;font-size:12.5px">· checked on the award date, 16 Nov 2026</span></div><table><tr><th>Vendor</th><th>Status</th><th>Knock-out questions</th><th>Documents</th><th></th></tr>${q.map(r=>`<tr><td><b>${r[0]}</b> · ${VN[r[0]]}</td><td><span class="chip ${r[2]}">${r[1]}</span></td><td>${r[3]}</td><td class="mut">${r[4]}</td><td><span style="color:var(--bluet)">Open in Responses ↗</span></td></tr>`).join('')}</table></div>`}

if(S==='01'){lbl('01 · Bid Analysis: answer first, scenarios, risks, then the grid');M.innerHTML=head()+hero('A')+cards('A')+risks()+grid('A')+charts('A')+qual(false)}
if(S==='02'){lbl('02 · Click a price → build-up and why it can\'t win');M.innerHTML=head()+hero('A')+cards('A')+risks()+grid('A','inr',null,1);
 O.innerHTML=`<div class="shade"></div><div class="drawer"><h2>Line 1 · V5 Krishna Kraft <span class="mut">✕</span></h2><div class="mut" style="font-size:13px">Shampoo 180ml bottle shipper (24s) · 3-ply · 120,000 a year</div>
 <div class="note" style="background:var(--redbg);color:var(--redt)"><b>Can't win:</b> V5 is disqualified. Its ISO 9001 certificate expired on 31 Mar 2026, before the award date (Q01 knock-out).</div>
 <div style="font-weight:600;margin-top:10px">Price build-up <span class="mut" style="font-weight:400">(₹ per piece)</span></div>
 <div class="wf"><div class="wfr"><span>Base price</span><div class="bar" style="width:86%"></div><b>7.296</b></div><div class="mut" style="font-size:12px;margin:-2px 0 6px 158px">₹38/kg × 0.192 kg box weight <span class="chip blue">derived</span></div>
 <div class="wfr"><span>+ Freight</span><div class="bar add" style="width:14%;margin-left:86%"></div><b>1.200</b></div><div class="mut" style="font-size:12px;margin:-2px 0 6px 158px">not quoted · estimated at the highest other vendor's freight</div>
 <div class="wfr"><span>+ Payment cost</span><div class="bar add" style="width:2%;margin-left:99%"></div><b>0.038</b></div><div class="mut" style="font-size:12px;margin:-2px 0 6px 158px">45 days vs our 60 · 10.9% cost of funds</div>
 <div class="wfr"><span><b>= Evaluated</b></span><div class="bar tot" style="width:100%"></div><b>8.534</b></div></div>
 <div class="panel" style="font-size:13px;line-height:1.7">Cheapest eligible on this line: <b>V1 ₹8.87</b> (V5 would be 3.8% cheaper)<br>Backup: <b>V3 ₹9.53</b> · <span class="nfdot"></span> price not firm<br>Last year: ₹8.69 (V1)</div>
 <div style="display:flex;gap:8px;margin-top:14px"><span class="btn">See source in Review ↗</span><span class="btn">💬 Ask about this line</span></div></div>`}
if(S==='03'){lbl('03 · “% above cheapest” view + “Close calls” filter');M.innerHTML=head()+hero('A')+cards('A')+grid('A','pct','close')+`<div class="note b-blue">ℹ️ Close calls are lines where the backup is within 2% of the winner. Small changes (a confirmed value, a discount) could flip these.</div>`}
if(S==='04'){lbl('04 · Scenario switched: “Exclude V3” shows the trade-off');const a=DATA.S.A,c=DATA.S.C;
 M.innerHTML=head()+hero('C')+`<div class="note b-amb">⚠️ Excluding V3 removes ${cr(a.nf)} of not-firm prices, but savings vs last year drop by ${lk(a.sav-c.sav)} and <b>lines 16 and 25 have no eligible bid</b> (only V1 is qualified, and its offers there are a deviation and a substitute).</div>`+cards('C')+grid('C')}
if(S==='05'){lbl('05 · Charts: award split and price spread (disqualified never ranked)');M.innerHTML=head()+hero('A')+charts('A')}
if(S==='06'){lbl('06 · Qualification & documents, expanded');M.innerHTML=head()+hero('A')+risks()+qual(true)}
</script></body></html>
