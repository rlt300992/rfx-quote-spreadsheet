fx:
  USD_INR: 95.17
  date: '2026-10-26'
  source: Market close (Pound Sterling Live); not SBI TT selling
cost_of_funds_pct: 10.9
payment_loading_max_extra_days: 30
msme_max_credit_days: 45
weight_formula:
  flute_factors:
    A: 1.55
    B: 1.35
    C: 1.45
    E: 1.3
  sheet_margin_mm:
    normal: 60
    large: 120
  large_cutoff_L_plus_W_mm: 890
  sheet_width_allowance_mm: 30
  wastage_factor: 1.03
sanity_band_pct: 25
weight_mismatch_pct: 5
confidence_base:
  excel: 0.92
  word: 0.85
  pdf: 0.85
  email_text: 0.8
  photo: 0.65
thresholds:
  core:
    auto: 0.95
    spot: 0.8
    fields:
    - price
    - unit
    - currency
    - freight
    - tax_basis
  terms:
    auto: 0.85
    spot: 0.7
    fields:
    - lead_time
    - moq
    - payment_terms
  knockout_answer_min: 0.95
gemini:
  model: gemini-3.8-flash   # restored now that billing (Tier 1) is on; the free tier's 20 requests/day had forced a temporary switch
  fallback_models:          # tried in order only if a model's quota is exhausted (the cache is checked for all of them)
    - gemini-3.6-flash
  temperature: 0
  prompt_version: v1        # default for every prompt
  prompt_versions:          # per-prompt override: bump ONLY the prompt you changed
    quote_extract: v4       # v2: volume discounts carry a quantity basis; v3: per-order phrases; v4: worked examples + firmer OCR-uncertainty rule
  timeout_s: 180
  max_output_tokens: 32768
confidence:
  check_bonus: 0.05      # added per passed relevant validation check (core fields)
  cap: 0.99              # no field is ever 100% from signals alone
eligibility:
  block_price_not_firm: false   # PRICE_NOT_FIRM (rm-linked) is flagged, not a hard exclusion
chat:
  max_messages: 30       # analyst chat messages per browser session (protects the API key on the public app)
